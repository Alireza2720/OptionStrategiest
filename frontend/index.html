function BestPositionsOverlay(props){
  var open=props.open,onClose=props.onClose,huntData=props.huntData,huntLoading=props.huntLoading,
    huntError=props.huntError,onRetry=props.onRetry,globalSearch=props.globalSearch,onOpenChart=props.onOpenChart;

  var topNArr=useLocalStorage("bestTopNDisplay",30);
  var topN=topNArr[0],setTopN=topNArr[1];
  var onlyBuyArr=useLocalStorage("bestOnlyBuyableDisplay",true);
  var onlyBuyable=onlyBuyArr[0],setOnlyBuyable=onlyBuyArr[1];

  var rows=(huntData&&huntData.rows)||EMPTY_ARR;
  var steps=(huntData&&huntData.steps)||EMPTY_ARR;

  var searchDeb=useDebounced(globalSearch,180);
  var onlyBuyDeb=useDebounced(onlyBuyable,150);

  var filtered=useMemo(function(){
    var r=rows;
    if(onlyBuyDeb)r=r.filter(function(x){return !BUYABLE_CHECK_TYPES[x.strategy_type]||x.basis_buyable!==false});
    r=r.filter(function(x){return matchesGlobalSearch({name:x.primary_name,basis_name:x.basis_name},searchDeb)});
    return r;
  },[rows,onlyBuyDeb,searchDeb]);

  var sortRes=useSort(filtered,"min_shock","desc");
  var sorted=sortRes.sorted,s=sortRes.s,dir=sortRes.dir,onS=sortRes.onS;

  var limited=useMemo(function(){
    var lim=parseInt(topN,10);
    if(!lim||lim<=0)return sorted;
    return sorted.slice(0,lim);
  },[sorted,topN]);

  if(!open)return null;

  var totalCols=5+steps.length*2+6;

  function ThB(p){
    var active=s===p.col;
    return (
      <th onClick={function(){onS(p.col)}} role="columnheader"
        aria-sort={active?(dir==="asc"?"ascending":"descending"):"none"} tabIndex={0}
        onKeyDown={function(e){if(e.key==="Enter"||e.key===" "){e.preventDefault();onS(p.col)}}}>
        {p.children}{active?<span className="s2">{dir==="asc"?"▲":"▼"}</span>:null}
      </th>
    );
  }

  function rowClickHandler(row){
    if(!onOpenChart)return undefined;
    return function(){onOpenChart(row.strategy_type,row)};
  }

  return (
    <div className="fs-overlay" role="dialog" aria-label={L.huntPositions}>
      <div className="fs-head">
        <b>{L.huntPositions}</b>
        {huntData&&huntData.at?<span className="tb">آخرین اجرا: {new Date(huntData.at).toLocaleTimeString("fa-IR")}</span>:null}
        <div className="sp1" />
        <button className="ib" onClick={onRetry} aria-label="بروزرسانی" title="بروزرسانی">↻</button>
        <button className="ib" onClick={onClose} aria-label="بستن">✕</button>
      </div>
      <div className="fs-body">
        <div className="best-controls">
          <div className="best-field">
            <label>{L.topNLbl}</label>
            <NumberField className="mini-num" value={topN} min={1} max={500} onCommit={setTopN} ariaLabel={L.topNLbl} />
          </div>
          <label className="toggle-switch">
            <input type="checkbox" checked={onlyBuyable} onChange={function(e){setOnlyBuyable(e.target.checked)}} />
            {L.onlyBuyableLbl}
          </label>
          <span className="count-badge">{limited.length}</span>
        </div>
        {huntError?(
          <div className="error-box"><div className="title">خطا در دریافت اطلاعات</div><div className="desc">{huntError}</div></div>
        ):huntLoading&&!huntData?(
          <div className="center" style={{flex:1}}><div className="spinner" /></div>
        ):(
          <div className="tw-wrap" style={{flex:1,minHeight:0,display:"flex",flexDirection:"column"}}>
            <div className="tw" style={{flex:1}}>
              <table className="tbl-best">
                <colgroup>
                  <col style={{width:90}} />
                  <col style={{width:160}} />
                  <col style={{width:100}} />
                  <col style={{width:90}} />
                  <col style={{width:55}} />
                  {steps.map(function(_,i){return <col key={"hcsc"+i} style={{width:54}} />})}
                  {steps.map(function(_,i){return <col key={"hcraw"+i} style={{width:54}} />})}
                  <col style={{width:80}} />
                  <col style={{width:85}} />
                  <col style={{width:85}} />
                  <col style={{width:90}} />
                  <col style={{width:80}} />
                  <col style={{width:80}} />
                </colgroup>
                <thead>
                  <tr>
                    <ThB col="strategy_type">{L.strategyTypeLbl}</ThB>
                    <th>موقعیت</th>
                    <ThB col="basis_name">{L.basis}</ThB>
                    <ThB col="expiry">{L.expiry}</ThB>
                    <ThB col="dte">{L.dte}</ThB>
                    {steps.map(function(v,i){
                      var key="sc"+i,active=s===key;
                      return (
                        <th key={key} className="svh" onClick={function(){onS(key)}} role="columnheader"
                          aria-sort={active?(dir==="asc"?"ascending":"descending"):"none"} tabIndex={0}
                          onKeyDown={function(e){if(e.key==="Enter"||e.key===" "){e.preventDefault();onS(key)}}}>
                          {"تعدیل "+(v>0?"+":"")+n(v,1)+"٪"}
                          {active?<span className="s2">{dir==="asc"?"▲":"▼"}</span>:null}
                        </th>
                      );
                    })}
                    {steps.map(function(v,i){
                      var key="raw"+i,active=s===key;
                      return (
                        <th key={key} className={"svh"+(i===0?" raw-divider":"")} onClick={function(){onS(key)}} role="columnheader"
                          aria-sort={active?(dir==="asc"?"ascending":"descending"):"none"} tabIndex={0}
                          onKeyDown={function(e){if(e.key==="Enter"||e.key===" "){e.preventDefault();onS(key)}}}>
                          {i===0?<HeaderTip text={L.scenarioNote}><span className="info-icon">ℹ</span></HeaderTip>:null}
                          {"واقعی "+(v>0?"+":"")+n(v,1)+"٪"}
                          {active?<span className="s2">{dir==="asc"?"▲":"▼"}</span>:null}
                        </th>
                      );
                    })}
                    <ThB col="roi_zero">{L.roiZeroCol}</ThB>
                    <ThB col="required_shock">{L.requiredShockCol}</ThB>
                    <ThB col="actual_shock_up">{L.actualShockUpCol}</ThB>
                    <ThB col="actual_shock_down">{L.actualShockDownCol}</ThB>
                    <ThB col="min_shock">{L.minShockCol}</ThB>
                    <ThB col="required_profit">{L.requiredProfitCol}</ThB>
                  </tr>
                </thead>
                <tbody>
                  {limited.length===0?(
                    <tr><td colSpan={totalCols} style={{textAlign:"center",padding:20,color:"var(--mut)"}}>{L.noData}</td></tr>
                  ):null}
                  {limited.map(function(row){
                    var isNoShock=!!HUNT_NO_SHOCK_TYPES[row.strategy_type];
                    var badgeCls=isNoShock?"bdg-itm":"bdg-rev";
                    return (
                      <ErrorBoundary key={bestRowKey(row)} fallback={function(){return <tr><td colSpan={totalCols}>خطا</td></tr>}}>
                        <tr onClick={rowClickHandler(row)} style={onOpenChart?{cursor:"pointer"}:undefined}>
                          <td><span className={"bdg "+badgeCls}>{BEST_STRATEGY_LABELS[row.strategy_type]||row.strategy_type}</span></td>
                          <td className="tn">{BasisNameR(row.primary_name,row)}</td>
                          <td className="tb">{BasisNameR(row.basis_name,row)}</td>
                          <td className="mut">{row.expiry}</td>
                          <td>{n(row.dte)}</td>
                          {(row.scenariosAdjusted||[]).map(function(v,j){
                            return <td key={"sc"+j} className={"sv "+scenClass(v)}>{plainPct(v)}</td>;
                          })}
                          {(row.scenariosRaw||[]).map(function(v,j){
                            return <td key={"raw"+j} className={"sv "+scenClass(v)+(j===0?" raw-divider":"")}>{plainPct(v)}</td>;
                          })}
                          <td className={"sv "+scenClass(row.roi_zero)}>{plainPct(row.roi_zero)}</td>
                          <td className="sv">{isNoShock?"—":fmtShock(row.required_shock)}</td>
                          <td className="sv">{isNoShock?"—":fmtShock(row.actual_shock_up)}</td>
                          <td className="sv">{isNoShock?"—":fmtShock(row.actual_shock_down)}</td>
                          <td className="sv" style={{fontWeight:700}}>{isNoShock?"—":fmtShock(row.min_shock)}</td>
                          <td className="sv">{n(row.required_profit,1)}٪</td>
                        </tr>
                      </ErrorBoundary>
                    );
                  })}
                </tbody>
              </table>
            </div>
            <button className="floating-export" onClick={function(){downloadXlsx(L.huntPositions,buildBestAoa(limited,steps))}}>
              ⬇ {L.exportXlsxShort}
            </button>
          </div>
        )}
      </div>
    </div>
  );
}
/* =========================================================
   App اصلی
   ========================================================= */
function App(){
  var themeArr=useTheme();
  var theme=themeArr[0],setTheme=themeArr[1];
  var refreshSecArr=useLocalStorage("refreshIntervalSec",DEFAULT_REFRESH_SEC);
  var refreshSec=refreshSecArr[0],setRefreshSec=refreshSecArr[1];
  var autoRefreshArr=useLocalStorage("autoRefreshEnabled",false);
  var autoRefreshEnabled=autoRefreshArr[0],setAutoRefreshEnabled=autoRefreshArr[1];

  var stSettings=useState(null);var settings=stSettings[0],setSettings=stSettings[1];
  var stSettingsErr=useState(null);var settingsError=stSettingsErr[0],setSettingsError=stSettingsErr[1];
  var stOverrides=useState([]);var overrides=stOverrides[0],setOverrides=stOverrides[1];
  var stHoliday=useState(null);var holidayStatus=stHoliday[0],setHolidayStatus=stHoliday[1];
  var stHolidayBusy=useState(false);var holidayBusy=stHolidayBusy[0],setHolidayBusy=stHolidayBusy[1];

  var stTabsData=useState({});var tabsData=stTabsData[0],setTabsData=stTabsData[1];
  var stTabLoading=useState({});var tabLoading=stTabLoading[0],setTabLoading=stTabLoading[1];
  var stTabError=useState({});var tabError=stTabError[0],setTabError=stTabError[1];

  var stHuntData=useState(null);var huntData=stHuntData[0],setHuntData=stHuntData[1];
  var stHuntLoading=useState(false);var huntLoading=stHuntLoading[0],setHuntLoading=stHuntLoading[1];
  var stHuntErr=useState(null);var huntError=stHuntErr[0],setHuntError=stHuntErr[1];
  var stHuntOpen=useState(false);var huntOpen=stHuntOpen[0],setHuntOpen=stHuntOpen[1];

  var stMenu=useState(false);var menuOpen=stMenu[0],setMenuOpen=stMenu[1];
  var stTab=useState("watch");var tab=stTab[0],setTab=stTab[1];
  var stSearch=useState("");var globalSearch=stSearch[0],setGlobalSearch=stSearch[1];

  var stRefreshing=useState(false);var refreshing=stRefreshing[0],setRefreshing=stRefreshing[1];
  var stApplying=useState(false);var applying=stApplying[0],setApplying=stApplying[1];
  var stGlobalErr=useState(null);var globalError=stGlobalErr[0],setGlobalError=stGlobalErr[1];

  var stChart=useState(null);var chartCtx=stChart[0],setChartCtx=stChart[1];

  var sectionStoreRef=useRef({});
  var watchStoreRef=useRef({});

  var tabRef=useRef(tab);useEffect(function(){tabRef.current=tab},[tab]);
  var huntOpenRef=useRef(false);useEffect(function(){huntOpenRef.current=huntOpen},[huntOpen]);

  /* ---------- بارگذاری داده از سرور ---------- */
  function loadTabData(kind){
    setTabLoading(function(prev){return Object.assign({},prev,{[kind]:true})});
    var p=kind==="watch"
      ?Api.watch().then(function(r){return {updatedAt:r.updatedAt,rows:r.rows}})
      :Api.strategy(kind).then(function(r){return {updatedAt:r.updatedAt,steps:r.steps,rows:r.rows}});
    return p.then(function(data){
      setTabsData(function(prev){return Object.assign({},prev,{[kind]:data})});
      setTabError(function(prev){var c=Object.assign({},prev);delete c[kind];return c});
      return data;
    }).catch(function(e){
      setTabError(function(prev){return Object.assign({},prev,{[kind]:e.message})});
      throw e;
    }).finally(function(){
      setTabLoading(function(prev){return Object.assign({},prev,{[kind]:false})});
    });
  }

  /* فقط تب فعلی (و شکار در صورت باز بودن) دوباره خوانده می‌شود */
  function reloadCurrentTab(){
    var kind=tabRef.current;
    var tasks=[loadTabData(kind).catch(function(){})];
    if(huntOpenRef.current)tasks.push(loadHunt());
    return Promise.all(tasks);
  }

  function loadHunt(){
    setHuntLoading(true);
    return Api.huntLatest().then(function(res){setHuntData(res);setHuntError(null)})
      .catch(function(e){setHuntError(e.message)}).finally(function(){setHuntLoading(false)});
  }

  function loadSettings(){
    return Api.getSettings().then(function(s){setSettings(s);setSettingsError(null)})
      .catch(function(e){setSettingsError(e.message)});
  }
  function loadOverrides(){
    return Api.getOverrides().then(function(list){setOverrides(list||[])}).catch(function(){});
  }
  function loadHolidayStatus(){
    return Api.marketToday().then(function(r){setHolidayStatus(r)}).catch(function(){});
  }

  useEffect(function(){
    loadSettings();
    loadOverrides();
    loadHolidayStatus();
    loadTabData("watch").catch(function(){});
  },[]);

  // نشانگر بازه‌ی ارسال پیام باید مستقل از تنظیم "بروزرسانی خودکار" هر ۶۰ ثانیه به‌روز بماند
  useEffect(function(){
    var interval=setInterval(function(){loadHolidayStatus()},60000);
    return function(){clearInterval(interval)};
  },[]);

  useEffect(function(){if(huntOpen&&!huntData)loadHunt()},[huntOpen]);

  /* ---------- بروزرسانی دستی کامل (اجرای مجدد محاسبات روی سرور) ---------- */
  function handleManualRefresh(){
    setRefreshing(true);
    setGlobalError(null);
    Api.refresh().then(function(){
      return reloadCurrentTab();
    }).catch(function(e){
      setGlobalError("خطا در بروزرسانی: "+e.message);
    }).finally(function(){
      setRefreshing(false);
    });
  }

  /* ---------- بروزرسانی خودکار (فقط تب فعلی، بدون اجرای مجدد محاسبات) ---------- */
  useEffect(function(){
    if(!autoRefreshEnabled)return;
    var ms=Math.max(MIN_REFRESH_SEC,Math.min(MAX_REFRESH_SEC,parseFloat(refreshSec)||DEFAULT_REFRESH_SEC))*1000;
    var interval=null;
    function tick(){reloadCurrentTab()}
    function start(){if(!interval)interval=setInterval(tick,ms)}
    function stop(){if(interval){clearInterval(interval);interval=null}}
    function onVis(){
      if(document.visibilityState==="visible"){document.body.classList.remove("bg-hidden");tick();start()}
      else{document.body.classList.add("bg-hidden");stop()}
    }
    start();
    document.addEventListener("visibilitychange",onVis);
    return function(){stop();document.removeEventListener("visibilitychange",onVis)};
  },[autoRefreshEnabled,refreshSec]);

  /* ---------- تنظیمات ---------- */
  function updateSettings(partial,needsRefresh){
    setSettings(function(prev){return Object.assign({},prev,partial)});
    setApplying(true);
    setGlobalError(null);
    Api.postSettings(partial).then(function(saved){
      setSettings(saved);
      if(needsRefresh){
        return Api.refresh().then(reloadCurrentTab);
      }
    }).catch(function(e){
      setGlobalError("خطا در ذخیره تنظیمات: "+e.message);
      loadSettings();
    }).finally(function(){setApplying(false)});
  }

  /* ---------- قیمت دلخواه سهم پایه ---------- */
  function afterOverrideChange(){
    setApplying(true);
    return loadOverrides().then(function(){
      return Api.refresh();
    }).then(reloadCurrentTab).catch(function(e){
      setGlobalError("خطا در اعمال تغییرات: "+e.message);
    }).finally(function(){setApplying(false)});
  }
  function handleAddOverride(name,price){
    Api.postOverride({name:name,price:price,enabled:true}).then(afterOverrideChange)
      .catch(function(e){setGlobalError(e.message)});
  }
  function handleToggleOverride(name,enabled){
    var existing=overrides.find(function(o){return o.name===name});
    if(!existing)return;
    Api.postOverride({name:name,price:existing.price,enabled:enabled}).then(afterOverrideChange)
      .catch(function(e){setGlobalError(e.message)});
  }
  function handleUpdateOverridePrice(name,price){
    var existing=overrides.find(function(o){return o.name===name});
    if(!existing)return;
    Api.postOverride({name:name,price:price,enabled:existing.enabled}).then(afterOverrideChange)
      .catch(function(e){setGlobalError(e.message)});
  }
  function handleRemoveOverride(name){
    Api.deleteOverride(name).then(afterOverrideChange)
      .catch(function(e){setGlobalError(e.message)});
  }
  function handleToggleHoliday(){
    setHolidayBusy(true);
    Api.toggleHoliday().then(function(res){
      setHolidayStatus({todayKey:res.todayKey,isHoliday:res.isHoliday,isMarketOpenNow:holidayStatus?holidayStatus.isMarketOpenNow:false});
      setSettings(function(prev){return prev?Object.assign({},prev,{manualHolidays:res.settings.manualHolidays}):prev});
    }).catch(function(e){
      setGlobalError("خطا در تغییر وضعیت تعطیلی: "+e.message);
    }).finally(function(){setHolidayBusy(false)});
  }

  var activeOverrideCount=useMemo(function(){
    var c=0;overrides.forEach(function(o){if(o.enabled&&o.price>0)c++});return c;
  },[overrides]);

  var basisMeta=useMemo(function(){
    var watchRows=(tabsData.watch&&tabsData.watch.rows)||EMPTY_ARR;
    var namesSet={},spotMap={};
    watchRows.forEach(function(c){
      if(c.basis_name){
        namesSet[c.basis_name]=true;
        var realSpot=c.spot_overridden?c.spot_original:c.spot;
        if((spotMap[c.basis_name]==null)&&realSpot>0)spotMap[c.basis_name]=realSpot;
      }
    });
    var names=Object.keys(namesSet).sort(function(a,b){return a.localeCompare(b,"fa")});
    return {names:names,spotMap:spotMap};
  },[tabsData.watch]);

  function handleTabClick(id){
    setTab(id);
    if(!tabsData[id]&&!tabLoading[id])loadTabData(id);
  }

  /* ---------- نمودار ---------- */
  function openChart(kind,row){setChartCtx({kind:kind,row:row})}
  function closeChart(){setChartCtx(null)}

  var dotCls="dot"+((refreshing||applying)?" sp":(globalError?" er":""));

  var coTrailingCols=useMemo(function(){
    return [{k:"collar_type",l:function(){return L.collarType},r:function(v){return <span className={"bdg "+(v===L.collarReverse?"bdg-rev":"bdg-itm")}>{v}</span>}}];
  },[]);

  var watchTabData=tabsData.watch;
  var currentData=tabsData[tab];
  var currentLoading=tabLoading[tab];
  var currentError=tabError[tab];

  return (
    <div className="app">
      <HamMenu
        open={menuOpen} onClose={function(){setMenuOpen(false)}} theme={theme} setTheme={setTheme}
        settings={settings} updateSettings={updateSettings}
        dteFilterMin={settings?settings.dteFilterMin:""} dteFilterMax={settings?settings.dteFilterMax:""}
        overrides={overrides} onAddOverride={handleAddOverride} onToggleOverride={handleToggleOverride}
        onUpdateOverridePrice={handleUpdateOverridePrice} onRemoveOverride={handleRemoveOverride}
        basisNames={basisMeta.names} basisSpotMap={basisMeta.spotMap}
        refreshSec={refreshSec} setRefreshSec={setRefreshSec}
        autoRefreshEnabled={autoRefreshEnabled} setAutoRefreshEnabled={setAutoRefreshEnabled}
        onOpenHunt={function(){setHuntOpen(true)}}
        holidayStatus={holidayStatus} onToggleHoliday={handleToggleHoliday} holidayBusy={holidayBusy}
      />

      <BestPositionsOverlay open={huntOpen} onClose={function(){setHuntOpen(false)}}
        huntData={huntData} huntLoading={huntLoading} huntError={huntError}
        onRetry={loadHunt} globalSearch={globalSearch} onOpenChart={openChart} />

      {chartCtx?(
        <ErrorBoundary fallback={function(){return <FloatFallback onClose={closeChart} />}}>
          <PayoffPanel row={chartCtx.row} kind={chartCtx.kind} onClose={closeChart} />
        </ErrorBoundary>
      ):null}

      <div className="top">
        <button className="ib" onClick={function(){setMenuOpen(true)}} aria-label={L.menu}>
          ☰
          {activeOverrideCount>0?<span className="ov-indicator" title={activeOverrideCount+" سهم پایه با قیمت دستی فعال است"} />:null}
        </button>
        <span className="brand-top">استراتژیست آپشن</span>
        <div className="sp1" />
        <div className="search-box">
          <input type="text" className="search-input" placeholder="جستجوی نماد..."
            value={globalSearch} onChange={function(e){setGlobalSearch(e.target.value)}} />
          {globalSearch?<button className="search-clear" onClick={function(){setGlobalSearch("")}}>✕</button>:null}
        </div>
        <div className="status-chip" role="status">
          <div className={dotCls} />
          <span>{refreshing?"در حال اجرای محاسبات...":applying?"در حال اعمال تنظیمات...":globalError?"خطا":(watchTabData&&watchTabData.updatedAt)?new Date(watchTabData.updatedAt).toLocaleTimeString("fa-IR"):""}</span>
        </div>
        {holidayStatus?(
          <div className="status-chip" role="status" title={L.marketWindowHint}>
            <div style={{width:6,height:6,borderRadius:"50%",background:holidayStatus.isMarketOpenNow?"var(--gain)":"var(--mut)"}} />
            <span>{holidayStatus.isMarketOpenNow?L.marketOpenNowLbl:L.marketClosedNowLbl}</span>
          </div>
        ):null}
        <button className="rbtn" onClick={handleManualRefresh} disabled={refreshing} aria-label={L.refresh} title={L.refresh}>↻</button>
      </div>

      {globalError?(
        <div className="stale-banner">{globalError} <button className="cbtn" style={{marginRight:8}} onClick={function(){setGlobalError(null)}}>باشه</button></div>
      ):null}

      <div className="tabs" role="tablist">
        {BASE_TABS.map(function(t){
          var pending=t.id===tab?(!currentData&&currentLoading):false;
          return (
            <button key={t.id} className={"tab"+(tab===t.id?" on":"")} role="tab" aria-selected={tab===t.id} onClick={function(){handleTabClick(t.id)}}>
              {pending?<span className="tab-spin-dot" />:null}
              {L[t.l]||t.id}
            </button>
          );
        })}
      </div>

      {tab!=="watch"&&activeOverrideCount>0?(
        <div className="override-banner">
          {activeOverrideCount} سهم پایه با قیمت دستی در محاسبات اعمال شده است (قابل مدیریت از تنظیمات ☰).
        </div>
      ):null}

      <div className="cnt">
        {tab==="watch"?(
          !watchTabData&&!tabError.watch?(
            <div className="center"><div className="spinner" role="status" aria-label="در حال بارگذاری" /><span>در حال دریافت داده از سرور...</span></div>
          ):tabError.watch&&!watchTabData?(
            <div className="center">
              <div className="error-box">
                <div className="title">خطا در دریافت داده</div>
                <div className="desc">{tabError.watch}</div>
                <button className="rbtn" style={{width:"auto",padding:"0 16px",margin:"12px auto 0"}} onClick={function(){loadTabData("watch")}}>تلاش مجدد</button>
              </div>
            </div>
          ):(
            <div className="panel-active">
              <ErrorBoundary fallback={function(){return <div className="error-box">خطا در نمایش دیده‌بان</div>}}>
                <Watch rows={watchTabData.rows} store={watchStoreRef.current} storeKey="watch" globalSearch={globalSearch}
                  dteFilterMin={settings?settings.dteFilterMin:""} dteFilterMax={settings?settings.dteFilterMax:""} />
              </ErrorBoundary>
            </div>
          )
        ):(
          currentError?(
            <div className="center"><div className="error-box"><div className="title">خطا</div><div className="desc">{currentError}</div>
              <button className="rbtn" style={{width:"auto",padding:"0 16px",margin:"12px auto 0"}} onClick={function(){loadTabData(tab)}}>تلاش مجدد</button></div></div>
          ):currentData?(
            <div className="panel-active">
              {STRATEGY_META[tab]?(
                <StrategySection kind={tab} data={currentData.rows} steps={currentData.steps||[]}
                  dteFilterMin={settings?settings.dteFilterMin:""} dteFilterMax={settings?settings.dteFilterMax:""}
                  store={sectionStoreRef.current} globalSearch={globalSearch}
                  trailingCols={tab==="co"?coTrailingCols:EMPTY_ARR}
                  onOpenChart={openChart} />
              ):(
                <SimpleStrategySection kind={tab} data={currentData.rows} steps={currentData.steps||[]}
                  dteFilterMin={settings?settings.dteFilterMin:""} dteFilterMax={settings?settings.dteFilterMax:""}
                  store={sectionStoreRef.current} globalSearch={globalSearch}
                  onOpenChart={openChart} />
              )}
            </div>
          ):(<div className="center"><div className="spinner" /></div>)
        )}
      </div>
    </div>
  );
}

function RootFallback(){
  return (
    <div className="error-box" style={{marginTop:"20vh"}}>
      <div className="title">خطای غیرمنتظره</div>
      <div className="desc">برنامه با خطا مواجه شد. لطفاً صفحه را دوباره بارگذاری کنید.</div>
      <button className="rbtn" style={{width:"auto",padding:"0 16px",margin:"12px auto 0"}} onClick={function(){window.location.reload()}}>بارگذاری مجدد</button>
    </div>
  );
}

var root=ReactDOM.createRoot(document.getElementById("root"));
root.render(
  <ErrorBoundary fallback={RootFallback}>
    <App />
  </ErrorBoundary>
);
})();
</script>
</body>
</html>
