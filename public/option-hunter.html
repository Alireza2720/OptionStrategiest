<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>دیده‌بان اختیار معامله</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>
:root{
  --r:8px;--rs:5px;--f:'Vazirmatn','Tahoma',sans-serif;--row-pad:7px 10px;
  --bg:#f0f4f8;--sur:#fff;--sur2:#f5f7fa;--sur3:#edf0f5;--bor:#dce1ea;--bor2:#c8d0dc;
  --txt:#1e2635;--txt2:#4a5568;--mut:#8898aa;--acc:#3b82f6;--acc-d:#2563eb;--acc-t:rgba(59,130,246,.1);
  --gain:#16a34a;--gain-t:rgba(22,163,74,.1);--loss:#dc2626;--loss-t:rgba(220,38,38,.1);
  --warn:#d97706;--warn-t:rgba(217,119,6,.1);--sh:0 1px 3px rgba(0,0,0,.06);--sh-md:0 4px 12px rgba(0,0,0,.08);
  --zebra:rgba(0,0,0,.045);--fs:13px;
  --sh-win: 0 10px 26px -8px rgba(20,30,55,.18), 0 3px 10px -3px rgba(20,30,55,.12), 0 0 0 1px rgba(20,30,55,.03);
}
[data-theme=midnight]{
  --bg:#06080f;--sur:#0e1219;--sur2:#131720;--sur3:#181d28;--bor:#1e2535;--bor2:#2a3347;
  --txt:#c8d8f0;--txt2:#8898b8;--mut:#4a5870;--acc:#7c3aed;--acc-d:#6d28d9;--acc-t:rgba(124,58,237,.15);
  --gain:#10b981;--gain-t:rgba(16,185,129,.12);--loss:#f43f5e;--loss-t:rgba(244,63,94,.12);
  --warn:#f59e0b;--warn-t:rgba(245,158,11,.12);--sh:none;--sh-md:0 4px 20px rgba(0,0,0,.5);--zebra:rgba(255,255,255,.045);
  --sh-win: 0 12px 32px -10px rgba(0,0,0,.55), 0 3px 12px -3px rgba(0,0,0,.4);
}
[data-theme=solarized]{
  --bg:#fdf6e3;--sur:#eee8d5;--sur2:#e8e2cf;--sur3:#ddd8c0;--bor:#ccc5af;--bor2:#b8b0a0;
  --txt:#073642;--txt2:#2e5465;--mut:#657b83;--acc:#268bd2;--acc-d:#1a6fa8;--acc-t:rgba(38,139,210,.1);
  --gain:#2aa198;--gain-t:rgba(42,161,152,.1);--loss:#dc322f;--loss-t:rgba(220,50,47,.1);
  --warn:#cb4b16;--warn-t:rgba(203,75,22,.1);--sh:0 1px 3px rgba(0,0,0,.08);--sh-md:0 4px 14px rgba(0,0,0,.1);--zebra:rgba(0,0,0,.055);
  --sh-win: 0 10px 26px -8px rgba(50,40,10,.2), 0 3px 10px -3px rgba(50,40,10,.14);
}
[data-theme=slate]{
  --bg:#191b1f;--sur:#212429;--sur2:#282c32;--sur3:#30343b;--bor:#3a3f47;--bor2:#4a505a;
  --txt:#e5e7ea;--txt2:#aab0b9;--mut:#6d7480;--acc:#f59e0b;--acc-d:#d97706;--acc-t:rgba(245,158,11,.14);
  --gain:#4ade80;--gain-t:rgba(74,222,128,.12);--loss:#f87171;--loss-t:rgba(248,113,113,.12);
  --warn:#fbbf24;--warn-t:rgba(251,191,36,.12);--sh:none;--sh-md:0 4px 16px rgba(0,0,0,.4);--zebra:rgba(255,255,255,.05);
  --sh-win: 0 12px 30px -10px rgba(0,0,0,.5), 0 3px 10px -3px rgba(0,0,0,.35);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{height:100vh;overflow:hidden;background:var(--bg);color:var(--txt);font-family:var(--f);font-size:var(--fs);direction:rtl;transition:.2s}
button,input{font-family:var(--f)}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:12px;table-layout:fixed}
*::-webkit-scrollbar{width:8px;height:8px}
*::-webkit-scrollbar-track{background:var(--sur2)}
*::-webkit-scrollbar-thumb{background:var(--bor2);border-radius:5px}
.app{display:flex;flex-direction:column;height:100vh}
.top{height:46px;display:flex;align-items:center;gap:8px;padding:0 14px;background:var(--sur);border-bottom:1px solid var(--bor);position:relative;z-index:50;flex-shrink:0;box-shadow:var(--sh)}
.brand-top{position:absolute;left:50%;transform:translateX(-50%);font-size:15px;font-weight:800;white-space:nowrap;pointer-events:none;background:linear-gradient(90deg,var(--acc),var(--gain));background-clip:text;-webkit-background-clip:text;color:transparent}
@media (max-width:768px){.brand-top{display:none}}
.sp1{flex:1}
.ib,.rbtn{border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ib{width:32px;height:32px;border-radius:var(--rs);background:none;color:var(--mut);font-size:16px;position:relative}
.ib:hover{background:var(--sur2);color:var(--txt)}
.rbtn{width:32px;height:32px;border-radius:var(--rs);background:var(--acc);color:#fff;font-size:15px}
.rbtn:hover{background:var(--acc-d)}
.rbtn:disabled{opacity:.45;cursor:default}
.status-chip{display:flex;align-items:center;gap:6px;padding:3px 10px;border-radius:20px;background:var(--sur2);color:var(--mut);font-size:11px;white-space:nowrap}
.dot{width:6px;height:6px;border-radius:50%;background:var(--gain)}
.dot.sp{background:var(--warn)}.dot.er{background:var(--loss)}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.75)}}
.dot:not(.sp):not(.er){animation:pulse 2s infinite}
body.bg-hidden .dot:not(.sp):not(.er){animation:none}
@keyframes spin{to{transform:rotate(360deg)}}
.spinner{width:36px;height:36px;border:3px solid var(--bor);border-top-color:var(--acc);border-radius:50%;animation:spin .8s linear infinite}
.search-box{position:relative;display:flex;align-items:center}
.search-input{width:150px;padding:5px 26px 5px 10px;border:1px solid var(--bor);border-radius:20px;background:var(--sur2);color:var(--txt);font-size:12px}
.search-input:focus{outline:none;border-color:var(--acc);background:var(--sur)}
.search-clear{position:absolute;left:6px;border:none;background:none;color:var(--mut);cursor:pointer;font-size:11px}
.tabs{display:flex;overflow-x:auto;background:var(--sur);border-bottom:1px solid var(--bor);flex-shrink:0}
.tabs::-webkit-scrollbar{height:0}
.tab{height:38px;padding:0 14px;border:none;border-bottom:2px solid transparent;background:none;color:var(--mut);cursor:pointer;font-size:12px;white-space:nowrap;flex-shrink:0}
.tab:hover{color:var(--txt)}.tab.on{color:var(--acc);border-bottom-color:var(--acc);font-weight:700}
.cnt{flex:1;overflow:hidden;display:flex;flex-direction:column;min-height:0;position:relative}
.tab-panel{flex:1;display:flex;flex-direction:column;min-height:0}
.strategy-scroll{flex:1;overflow:auto;min-height:0;padding:4px 0 24px}
.watch-view{flex:1;overflow:hidden;display:flex;flex-direction:column;min-height:0}
.ibar{min-height:28px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;row-gap:4px;padding:5px 14px;background:var(--sur2);border-bottom:1px solid var(--bor);font-size:11px;color:var(--mut);flex-shrink:0}
.rlbl{font-size:11px;font-weight:600;color:var(--mut)}
.count-badge{padding:1px 8px;border-radius:20px;background:var(--acc-t);color:var(--txt);font-size:11px;font-weight:700}
.count-label{font-size:11px;color:var(--mut)}
.cbtn{padding:2px 9px;border:1px solid var(--loss);border-radius:4px;background:var(--loss-t);color:var(--loss);font-family:var(--f);font-size:11px;font-weight:600;cursor:pointer}
.cbtn-acc{border:1px solid var(--acc);background:var(--acc-t);color:var(--acc)}
.tw{width:100%;min-width:0;overflow:auto;-webkit-overflow-scrolling:touch}
.tw-strat{max-height:65vh}
.tw-wrap{position:relative;overflow:hidden}
thead{position:sticky;top:0;z-index:20}
thead tr{position:sticky;top:0;z-index:21;background:var(--sur)}
thead tr.fr{top:38px;z-index:20;background:var(--sur3)}
thead tr.fr td{padding:3px 4px;border-bottom:1px solid var(--bor)}
thead tr.fr input{width:100%;padding:3px 5px;border:1px solid var(--bor);border-radius:3px;background:var(--sur);color:var(--txt);font-family:var(--f);font-size:10px;outline:none}
thead tr.fr input:focus{border-color:var(--acc)}
th{position:sticky;top:0;z-index:21;padding:8px 9px;text-align:right;border-bottom:2px solid var(--bor);background:var(--sur);color:var(--mut);font-size:11px;font-weight:600;white-space:nowrap;cursor:pointer;user-select:none}
th:hover{color:var(--txt)}
td{padding:var(--row-pad);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
tbody tr{border-bottom:1px solid var(--bor);transition:.08s}
tbody tr:nth-child(even){background:var(--zebra)}
tbody tr:hover{background:var(--acc-t)!important}
.s2{margin-right:2px;font-size:8px;opacity:.6}
.tn{color:var(--acc);font-weight:600}.tb,.mut{color:var(--mut)}.tb{font-size:11px}
.gain{color:var(--gain)}.loss{color:var(--loss)}.warn{color:var(--warn)}
.bdg{display:inline-flex;align-items:center;padding:1px 7px;border-radius:20px;font-size:10px;font-weight:700}
.bdg-itm{background:var(--acc-t);color:var(--acc)}.bdg-otm{background:var(--sur3);color:var(--mut)}
.bdg-q1{background:var(--loss-t);color:var(--loss)}.bdg-rev{background:var(--warn-t);color:var(--warn)}
.sv{min-width:50px;padding:7px 3px;text-align:center;font-size:11px;font-weight:600}
.svh{min-width:50px;padding:8px 3px;text-align:center;font-size:10px;font-weight:600;color:var(--mut)}
.tc0{color:var(--mut)}.tc-pos{color:var(--gain);font-weight:700}.tc-neg{color:var(--loss);font-weight:700}
.raw-divider{border-right:2px dashed var(--bor2)}
.sticky-col{position:sticky;z-index:16;border-left:1px solid var(--bor);background:var(--sur);overflow:hidden;text-overflow:ellipsis}
thead .sticky-col{z-index:30;background:var(--sur)}thead tr.fr .sticky-col{z-index:29;background:var(--sur3)}
tbody td.sticky-col{z-index:6;background:var(--sur)}
tbody tr:nth-child(even) td.sticky-col{background:var(--sur2)}
tbody tr:hover td.sticky-col{background-color:var(--sur);background-image:linear-gradient(var(--acc-t),var(--acc-t))}
tbody tr:nth-child(even):hover td.sticky-col{background-color:var(--sur2)}
.col-resizer{position:absolute;top:0;bottom:0;left:-4px;width:8px;cursor:col-resize;z-index:5}
.col-resizer:hover,.col-resizer:active{background:var(--acc-t)}
.th-tip-wrap{position:relative;display:inline-flex;align-items:center}
.th-tooltip{position:fixed;z-index:200;width:210px;padding:6px 10px;border:1px solid var(--acc);border-radius:6px;background:var(--sur);color:var(--txt2);box-shadow:var(--sh-md);font-size:11px;font-weight:500;line-height:1.6;text-align:right;white-space:normal;pointer-events:none}
.collapsible-section{margin:4px 14px 10px}
.collapsible-header{display:flex;align-items:center;gap:8px;padding:6px 14px;border:1px solid var(--bor);border-radius:var(--rs);background:var(--sur3);color:var(--txt2);font-size:13px;font-weight:600;cursor:pointer;user-select:none}
.collapsible-header:hover{background:var(--sur2)}
.arrow{display:inline-block;font-size:12px;margin-left:6px;transition:.2s}.arrow.open{transform:rotate(90deg)}
.collapsible-content{overflow:hidden;transition:max-height .3s ease}.collapsible-content.open{max-height:100000px}.collapsible-content.closed{max-height:0}
.section-badge{margin-right:auto;padding:0 10px;border-radius:20px;background:var(--sur2);color:var(--mut);font-size:11px;font-weight:400}
.center{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:var(--mut);text-align:center;padding:20px}
.error-box{max-width:420px;margin:auto;padding:20px;border:1px solid var(--bor);border-radius:var(--r);background:var(--sur);box-shadow:var(--sh-md);text-align:center}
.error-box .title{margin-bottom:4px;color:var(--txt);font-size:16px;font-weight:700}.error-box .desc{color:var(--txt2);font-size:13px}
.stale-banner{padding:6px 12px;border-bottom:1px solid var(--bor);background:var(--warn-t);color:var(--warn);text-align:center;font-size:12px;flex-shrink:0}
.override-banner{padding:5px 12px;border-bottom:1px solid var(--bor);background:var(--warn-t);color:var(--warn);text-align:center;font-size:11.5px;flex-shrink:0}
.margin-note-banner{padding:6px 12px;border-bottom:1px solid var(--bor);background:var(--warn-t);color:var(--warn);text-align:center;font-size:11.5px;flex-shrink:0}
.busy-banner{padding:5px 12px;border-bottom:1px solid var(--bor);background:var(--acc-t);color:var(--acc);text-align:center;font-size:11.5px;flex-shrink:0}
.ov{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.15)}
.mpanel{position:fixed;top:0;right:0;bottom:0;z-index:90;width:320px;max-width:92vw;display:flex;flex-direction:column;border-left:1px solid var(--bor);background:var(--sur);box-shadow:var(--sh-md);transform:translateX(100%);transition:transform .25s cubic-bezier(.4,0,.2,1)}
.mpanel.open{transform:translateX(0)}
.mhead{height:46px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid var(--bor);font-size:14px;font-weight:700;flex-shrink:0}
.msub-tabs{display:flex;border-bottom:1px solid var(--bor);flex-shrink:0}
.msub-tab{flex:1;padding:9px 0;border:none;background:none;color:var(--mut);font-size:12px;font-weight:600;cursor:pointer;border-bottom:2px solid transparent}
.msub-tab.on{color:var(--acc);border-bottom-color:var(--acc)}
.mbody{flex:1;overflow-y:auto;padding:12px 14px}.msec{margin-bottom:18px}.msec-t{margin-bottom:8px;color:var(--mut);font-size:10px;font-weight:700;letter-spacing:.08em;display:flex;align-items:center;gap:6px}
.mdiv{height:1px;margin:6px 0;background:var(--bor)}
.step-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.step-input{width:70px;padding:6px 8px;border:1px solid var(--bor);border-radius:6px;background:var(--sur);color:var(--txt);font-family:var(--f);font-size:13px;text-align:center}
.step-hint{color:var(--mut);font-size:11.5px}
.ov-add-row{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.ov-input-name{flex:1;min-width:90px;padding:6px 8px;border:1px solid var(--bor);border-radius:6px;background:var(--sur);color:var(--txt);font-family:var(--f);font-size:12px}
.ov-input-name:focus,.ov-input-price:focus{outline:none;border-color:var(--acc)}
.ov-input-price{width:90px;padding:6px 8px;border:1px solid var(--bor);border-radius:6px;background:var(--sur);color:var(--txt);font-family:var(--f);font-size:12px;text-align:center}
.ov-input-price.sm{width:78px;padding:5px 6px;font-size:11px}
.ov-add-btn{padding:6px 14px;border:none;border-radius:6px;background:var(--acc);color:#fff;font-size:12px;font-weight:700;cursor:pointer;flex-shrink:0}
.ov-add-btn:hover{background:var(--acc-d)}
.ov-add-btn:disabled{opacity:.5;cursor:default}
.ov-list{display:flex;flex-direction:column;gap:6px;max-height:280px;overflow-y:auto}
.ov-item{display:flex;align-items:center;gap:7px;padding:6px 8px;border:1px solid var(--bor);border-radius:6px;background:var(--sur2)}
.ov-item.off{opacity:.5}
.ov-toggle{display:flex;align-items:center;flex-shrink:0}
.ov-toggle input{width:15px;height:15px;cursor:pointer}
.ov-name{flex:1;font-size:12px;font-weight:700;color:var(--txt);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ov-real{font-size:10px;color:var(--mut);min-width:54px;text-align:center;white-space:nowrap;flex-shrink:0}
.ov-remove{border:none;background:none;color:var(--loss);cursor:pointer;font-size:14px;padding:2px 5px;border-radius:4px;flex-shrink:0}
.ov-remove:hover{background:var(--loss-t)}
.ov-indicator{position:absolute;top:2px;left:2px;width:7px;height:7px;border-radius:50%;background:var(--warn);box-shadow:0 0 0 2px var(--sur)}
.floating-export{position:absolute;bottom:10px;left:10px;z-index:15;display:flex;align-items:center;gap:5px;padding:6px 12px;border:1px solid var(--acc);border-radius:20px;background:var(--sur);color:var(--acc);font-size:11px;font-weight:700;cursor:pointer;box-shadow:var(--sh-md);opacity:.9}
.floating-export:hover{opacity:1;background:var(--acc-t)}
.header-clear-btn{margin-right:8px;padding:1px 9px;border:1px solid var(--loss);border-radius:12px;background:var(--loss-t);color:var(--loss);font-size:10px;font-weight:600;cursor:pointer}
.info-icon{display:inline-flex;align-items:center;justify-content:center;width:14px;height:14px;border-radius:50%;background:var(--sur3);color:var(--mut);font-size:9px;cursor:help;margin-left:3px;flex-shrink:0}
.best-controls{display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:8px 14px;background:var(--sur2);border-bottom:1px solid var(--bor);flex-shrink:0}
.best-field{display:flex;align-items:center;gap:6px}
.best-field label{font-size:11px;color:var(--mut);font-weight:600;white-space:nowrap}
.toggle-switch{display:flex;align-items:center;gap:6px;cursor:pointer;font-size:11.5px;color:var(--txt2);white-space:nowrap}
.toggle-switch.small{font-size:11px;gap:5px}
.mini-num{width:60px;padding:5px 7px;border:1px solid var(--bor);border-radius:6px;background:var(--sur);color:var(--txt);font-family:var(--f);font-size:12px;text-align:center}
.tab-spin-dot{display:inline-block;width:6px;height:6px;border-radius:50%;border:1.5px solid var(--mut);border-top-color:transparent;margin-left:5px;animation:spin .7s linear infinite;vertical-align:middle}
.hunt-card{display:flex;align-items:center;justify-content:space-between;padding:11px 14px;border:1px solid var(--acc);border-radius:var(--rs);background:var(--acc-t);color:var(--acc);font-size:13px;font-weight:700;cursor:pointer}
.hunt-card:hover{background:var(--acc);color:#fff}
.fs-overlay{position:fixed;inset:0;z-index:95;background:var(--bg);display:flex;flex-direction:column}
.fs-head{height:46px;display:flex;align-items:center;gap:10px;padding:0 16px;border-bottom:1px solid var(--bor);background:var(--sur);flex-shrink:0}
.fs-head b{font-size:14px}
.fs-body{flex:1;overflow:hidden;display:flex;flex-direction:column;min-height:0}

/* ---- مودال ساده‌ی نمودار سود/زیان (بدون درگ/ریسایز/داک) ---- */
.modal-overlay{position:fixed;inset:0;z-index:150;background:rgba(10,14,22,.45);display:flex;align-items:center;justify-content:center;padding:16px}
.modal-box{width:100%;max-height:90vh;background:var(--bg);border:1px solid var(--bor);border-radius:var(--r);box-shadow:var(--sh-win);display:flex;flex-direction:column;overflow:hidden}
.modal-head{height:46px;display:flex;align-items:center;gap:10px;padding:0 16px;border-bottom:1px solid var(--bor);background:var(--sur);flex-shrink:0}
.modal-title{font-weight:700;font-size:14px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.modal-body{flex:1;overflow:auto;min-height:0}

.hint-btn{width:16px;height:16px;border-radius:50%;border:1px solid var(--bor2);background:var(--sur2);color:var(--mut);font-size:10px;line-height:1;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;padding:0;flex-shrink:0}
.hint-btn:hover{border-color:var(--acc);color:var(--acc)}
.theme-dots{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.theme-dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--bor2);cursor:pointer;padding:0}
.theme-dot.on{box-shadow:0 0 0 2px var(--sur),0 0 0 4px var(--acc)}
.inline-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.notify-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin:6px 0 10px}

.payoff-body{padding:10px 14px}
.payoff-info-grid{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.pinfo{background:var(--sur);border:1px solid var(--bor);border-radius:var(--rs);padding:6px 12px;display:flex;flex-direction:column;gap:2px;min-width:90px}
.pinfo span{font-size:10px;color:var(--mut)}
.pinfo b{font-size:13px;color:var(--txt)}
.payoff-chart-box{position:relative;background:var(--sur);border:1px solid var(--bor);border-radius:var(--r);padding:10px;box-shadow:var(--sh)}
.payoff-readout{margin-top:10px;background:var(--sur);border:1px solid var(--bor);border-radius:var(--r);padding:10px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-height:20px}
.ro-lbl{font-size:11.5px;color:var(--mut)}

function apiUrl(path){return CONFIG.API_BASE.replace(/\/$/,"")+path}
function apiGet(path){
  return fetch(apiUrl(path)).then(function(res){
    if(!res.ok)throw new Error("HTTP "+res.status);
    return res.json();
  });
}
function apiSend(method,path,body){
  var headers={"Content-Type":"application/json"};
  if(CONFIG.API_KEY)headers["x-api-key"]=CONFIG.API_KEY;
  return fetch(apiUrl(path),{
    method:method,headers:headers,
    body:body!==undefined?JSON.stringify(body):undefined
  }).then(function(res){
    return res.json().catch(function(){return {}}).then(function(json){
      if(!res.ok)throw new Error((json&&json.error)||("HTTP "+res.status));
      return json;
    });
  });
}

function clamp(v,min,max){return Math.max(min,Math.min(max,v))}
function sf(v,d){if(d===undefined)d=0;var x=parseFloat(v);return isNaN(x)?d:x}
function n(v,d){
  if(d===undefined)d=0;

}

  var s=Math.abs(parseFloat(step));

  for(var i=-3;i<=3;i++)a.push(Math.round(i*s*100)/100);

}

/* بازسازی تابع سود/زیان پیوسته از روی خروجی نهایی هر ردیف (برای نمودار) */
function computePayoffFn(kind,row){
  var size=row.size||0;
  if(kind==="cc"){
    var spot=row.spot,strike=row.strike,premium=row.premium||0;
    var block=(spot-premium)*size;
    return function(pct){var f=spot*(1+pct/100);return roiCalc(Math.min(strike,f)*size-block,block)};
  }
  if(kind==="mp"){
    var spot2=row.spot,strike2=row.strike,total=row.total_cost||0;
    return function(pct){var f=spot2*(1+pct/100);return roiCalc(Math.max(strike2,f)*size-total,total)};
  }
  if(kind==="co"){
    var spot3=row.spot,kCall=row.k_call,kPut=row.k_put;
    var net=(row.bid_price||0)-(row.ask_price||0);
    var block3=(spot3-net)*size;
    return function(pct){
      var f=spot3*(1+pct/100);
      var posVal=f-Math.max(f-kCall,0)+Math.max(kPut-f,0);
      return roiCalc((posVal+net-spot3)*size,block3);
    };
  }
  if(kind==="cv"||kind==="box"){
    var roiFixed=row.roi_zero;
    return function(){return roiFixed};
  }
  if(kind==="strangle"){
    var spot4=row.spot,kCall2=row.k_call,kPut2=row.k_put,totalCost=row.total_cost||0;
    return function(pct){
      var f=spot4*(1+pct/100);
      var val=(Math.max(f-kCall2,0)+Math.max(kPut2-f,0))*size;
      return roiCalc(val-totalCost,totalCost);
    };
  }
  if(kind==="strangleSell"){
    var spot5=row.spot,kCall3=row.k_call,kPut3=row.k_put,margin=row.margin||0;
    var totalPremium=(row.call_bid_price||0)*size+(row.put_bid_price||0)*size;
    return function(pct){
      var f=spot5*(1+pct/100);
      var optVal=(Math.max(f-kCall3,0)+Math.max(kPut3-f,0))*size;
      return roiCalc(totalPremium-optVal,margin);
    };
  }
  if(kind==="callspread"||kind==="callspreadbear"){
    var spot6=row.spot,kBuy=row.k_buy,kSell=row.k_sell,base=row.base||0;
    var netCost=(row.buy_ask_price||0)-(row.sell_bid_price||0);
    return function(pct){
      var f=spot6*(1+pct/100);
      var val=(Math.max(f-kBuy,0)-Math.max(f-kSell,0))*size;
      return roiCalc(val-netCost*size,base);
    };
  }
  if(kind==="putspread"||kind==="putspreadbull"){
    var spot7=row.spot,kBuy2=row.k_buy,kSell2=row.k_sell,base2=row.base||0;
    var netCost2=(row.buy_ask_price||0)-(row.sell_bid_price||0);
    return function(pct){
      var f=spot7*(1+pct/100);
      var val=(Math.max(kBuy2-f,0)-Math.max(kSell2-f,0))*size;
      return roiCalc(val-netCost2*size,base2);
    };
  }
  return function(){return row.roi_zero||0};
}

function useTheme(){
  var sys=window.matchMedia("(prefers-color-scheme:dark)").matches?"midnight":"light";
  var a=useState(function(){
    try{var x=localStorage.getItem("theme");return x&&THEMES.indexOf(x)!==-1?x:sys}catch(e){return sys}
  });
  useEffect(function(){
    document.documentElement.setAttribute("data-theme",a[0]);
    try{localStorage.setItem("theme",a[0])}catch(e){}
  },[a[0]]);
  return a;
}
function useLocalStorage(key,def){
  var a=useState(function(){
    try{var x=localStorage.getItem(key);return x!==null?JSON.parse(x):def}catch(e){return def}
  });
  useEffect(function(){
    try{localStorage.setItem(key,JSON.stringify(a[0]))}catch(e){}
  },[key,a[0]]);
  return a;
}
function useDebounced(value,delay){
  var a=useState(value);
  useEffect(function(){
    var t=setTimeout(function(){a[1](value)},delay);
    return function(){clearTimeout(t)};
  },[value,delay]);
  return a[0];
}

function NumberField(props){
  var value=props.value,onCommit=props.onCommit,className=props.className,
    min=props.min,max=props.max,style=props.style,placeholder=props.placeholder,
    disabled=props.disabled,ariaLabel=props.ariaLabel,allowEmpty=props.allowEmpty;
  var st=useState(function(){return value===""||value==null?"":String(value)});
  var text=st[0],setText=st[1];
  useEffect(function(){setText(value===""||value==null?"":String(value))},[value]);
  function commit(raw){
    if(raw===""){
      if(allowEmpty){onCommit("");return}
      setText(value===""||value==null?"":String(value));return;
    }
    var v=parseFloat(raw);
    if(isNaN(v)){setText(value===""||value==null?"":String(value));return}
    if(min!=null)v=Math.max(min,v);

    onCommit(v);setText(String(v));
  }

      value={text}

}

function useVirtualWindow(scrollRef,count,rowHeight,headerHeight,overscan){
  var st=useState({start:0,end:count});
  useEffect(function(){
    var el=scrollRef.current;
    if(!el)return;
    var ticking=false;
    function compute(){
      if(count<=VIRTUALIZE_THRESHOLD){st[1]({start:0,end:count});return}
      var scrollTop=Math.max(0,el.scrollTop-headerHeight);
      var viewH=el.clientHeight;
      var start=Math.floor(scrollTop/rowHeight)-overscan;
      start=Math.max(0,Math.min(start,count));
      var end=Math.ceil((scrollTop+viewH)/rowHeight)+overscan;
      end=Math.max(start,Math.min(count,end));
      st[1]({start:start,end:end});
    }
    function onScroll(){
      if(ticking)return;
      ticking=true;
      requestAnimationFrame(function(){compute();ticking=false});
    }
    compute();
    el.addEventListener("scroll",onScroll,{passive:true});
    window.addEventListener("resize",onScroll);
    return function(){el.removeEventListener("scroll",onScroll);window.removeEventListener("resize",onScroll)};
  },[scrollRef.current,count,rowHeight,headerHeight,overscan]);
  return count<=VIRTUALIZE_THRESHOLD?{start:0,end:count}:st[0];
}

function useColWidths(tableKey,cols){
  var storageKey="colw_"+tableKey;
  var st=useState(function(){
    try{var saved=localStorage.getItem(storageKey);if(saved)return JSON.parse(saved)}catch(e){}
    var mobile=isMobileViewport(),init={};
    cols.forEach(function(c){if(c.w)init[c.k]=Math.round(c.w*(mobile?0.82:1))});
    return init;
  });
  var widths=st[0],setWidths=st[1];
  useEffect(function(){
    var t=setTimeout(function(){
      try{localStorage.setItem(storageKey,JSON.stringify(widths))}catch(e){}
    },400);
    return function(){clearTimeout(t)};
  },[widths,storageKey]);
  var dragRef=useRef(null);
  function onMove(e){
    var d=dragRef.current;if(!d)return;
    var deltaX=e.clientX-d.startX;
    var newW=Math.max(d.minWidth,Math.round(d.startW-deltaX));
    setWidths(function(prev){var c=Object.assign({},prev);c[d.colKey]=newW;return c});
  }
  function onUp(){dragRef.current=null;window.removeEventListener("pointermove",onMove);window.removeEventListener("pointerup",onUp)}
  function startResize(colKey,minWidth){
    return function(e){
      e.preventDefault();e.stopPropagation();
      dragRef.current={colKey:colKey,startX:e.clientX,startW:widths[colKey]||100,minWidth:minWidth||8};
      window.addEventListener("pointermove",onMove);
      window.addEventListener("pointerup",onUp);
    };
  }
  useEffect(function(){return function(){window.removeEventListener("pointermove",onMove);window.removeEventListener("pointerup",onUp)}},[]);
  function getWidth(colKey,fallback){return widths[colKey]||fallback||100}
  return {widths:widths,startResize:startResize,getWidth:getWidth};
}

function getScenValue(row,key){
  if(key.indexOf("sc")===0&&!isNaN(key.slice(2))){
    var idx=parseInt(key.slice(2),10);
    return row.scenariosAdjusted?row.scenariosAdjusted[idx]:null;
  }
  if(key.indexOf("raw")===0&&!isNaN(key.slice(3))){
    var idx2=parseInt(key.slice(3),10);
    return row.scenariosRaw?row.scenariosRaw[idx2]:null;
  }
  return row[key];
}
function useSort(data,defaultKey,initialDir){
  var stK=useState(defaultKey),stD=useState(initialDir||"desc");
  var sortKey=stK[0],dir=stD[0];
  var sorted=useMemo(function(){
    var arr=data.slice();
    arr.sort(function(a,b){
      var va=getScenValue(a,sortKey),vb=getScenValue(b,sortKey);
      if(va==null&&vb==null)return 0;
      if(va==null)return 1;
      if(vb==null)return -1;
      if(typeof va==="string")return dir==="asc"?va.localeCompare(vb,"fa"):vb.localeCompare(va,"fa");
      return dir==="asc"?va-vb:vb-va;
    });
    return arr;
  },[data,sortKey,dir]);
  var onS=useCallback(function(key){
    stK[1](function(prev){
      if(prev===key)stD[1](function(d){return d==="desc"?"asc":"desc"});
      else stD[1]("desc");
      return key;
    });
  },[]);
  return {sorted:sorted,s:sortKey,dir:dir,onS:onS};
}

function useFilters(initial){
  var st=useState(initial||{});
  var f=st[0];
  var fDebounced=useDebounced(f,180);
  var set=useCallback(function(key,val){
    st[1](function(prev){
      var copy=Object.assign({},prev);
      if(val===""||val==null)delete copy[key];
      else copy[key]=val;
      return copy;
    });
  },[]);
  var clear=useCallback(function(){st[1]({})},[]);
  var has=Object.keys(f).length>0;
  var applyRow=useCallback(function(row,cols){
    for(var key in fDebounced){
      var filterVal=fDebounced[key];
      if(!filterVal)continue;
      if(key.indexOf("sc")===0&&!isNaN(key.slice(2))){
        var idx=parseInt(key.slice(2),10);
        var scenVal=row.scenariosAdjusted?row.scenariosAdjusted[idx]:null;
        var th=parseFloat(filterVal);
        if(isNaN(th))continue;
        if(scenVal==null||scenVal<th)return false;
        continue;
      }
      if(key.indexOf("raw")===0&&!isNaN(key.slice(3))){
        var idx2=parseInt(key.slice(3),10);
        var rawVal=row.scenariosRaw?row.scenariosRaw[idx2]:null;
        var th2=parseFloat(filterVal);
        if(isNaN(th2))continue;
        if(rawVal==null||rawVal<th2)return false;
        continue;
      }
      var col=cols.find(function(c){return c.k===key});
      var rowVal=row[key];
      if(col&&col.numeric){
        var num=parseFloat(filterVal);
        if(isNaN(num))continue;
        if(rowVal==null||rowVal<num)return false;
      }else{
        if(rowVal==null)return false;
        if(String(rowVal).toLowerCase().indexOf(String(filterVal).toLowerCase())===-1)return false;
      }
    }
    return true;
  },[fDebounced]);
  return {f:f,set:set,clear:clear,has:has,applyRow:applyRow};
}

class ErrorBoundary extends React.Component{
  constructor(props){super(props);this.state={hasError:false}}
  static getDerivedStateFromError(){return {hasError:true}}
  componentDidCatch(err,info){if(this.props.onError)this.props.onError(err,info)}
  render(){
    if(this.state.hasError){
      var fb=this.props.fallback;
      return typeof fb==="function"?fb():(fb||null);
    }
    return this.props.children;
  }
}

/* =========================================================
   مودال ساده‌ی نمودار سود/زیان (بدون درگ/ریسایز/داک)
   ========================================================= */
function Modal(props){
  var title=props.title,onClose=props.onClose,children=props.children,width=props.width||860;
  useEffect(function(){
    function onKey(e){if(e.key==="Escape")onClose()}
    window.addEventListener("keydown",onKey);
    return function(){window.removeEventListener("keydown",onKey)};
  },[onClose]);
  return (
    <div className="modal-overlay" onMouseDown={function(e){if(e.target===e.currentTarget)onClose()}}>
      <div className="modal-box" style={{maxWidth:width}} role="dialog" aria-label={typeof title==="string"?title:"پنجره"}>
        <div className="modal-head">
          <div className="modal-title">{title}</div>
          <button className="ib" onClick={onClose} aria-label="بستن">✕</button>
        </div>
        <div className="modal-body">{children}</div>
      </div>
    </div>
  );
}

function ModalFallback(props2){
  return (
    <div className="modal-overlay">
      <div className="modal-box" style={{maxWidth:380}}>
        <div className="modal-head">
          <div className="modal-title">خطا در نمایش نمودار</div>
          <button className="ib" onClick={props2.onClose} aria-label="بستن">✕</button>
        </div>
        <div className="modal-body" style={{padding:20,textAlign:"center"}}>
          <div className="desc" style={{marginBottom:10}}>لطفاً پنجره را ببندید و دوباره تلاش کنید.</div>
          <button className="cbtn" onClick={props2.onClose}>{L.close}</button>
        </div>
      </div>
    </div>
  );
}

/* =========================================================
   نمودار سود/زیان تکی (PayoffPanel) — داخل Modal ساده
   ========================================================= */
function PayoffPanel(props){
  var row=props.row,kind=props.kind,onClose=props.onClose;
  var svgRef=useRef(null);
  var chartBoxRef=useRef(null);

  var stMin=useState(-30);var rangeMin=stMin[0],setRangeMin=stMin[1];
  var stMax=useState(30);var rangeMax=stMax[0],setRangeMax=stMax[1];
  var stHover=useState(null);var hoverPct=stHover[0],setHoverPct=stHover[1];
  var stMouseLocal=useState(null);var mouseLocal=stMouseLocal[0],setMouseLocal=stMouseLocal[1];

  var payoffFn=useMemo(function(){return computePayoffFn(kind,row)},[kind,row]);
  if(!row)return null;

  var min=rangeMin,max=rangeMax;
  if(min>=max)max=min+1;
  if(min<-95)min=-95;

  var W=1000,H=360;
  var padL=58,padR=20,padT=20,padB=36;
  var plotW=W-padL-padR,plotH=H-padT-padB;

  var points=useMemo(function(){
    var SAMPLES=200,pts=[];
    for(var i=0;i<=SAMPLES;i++){
      var pct=min+(i/SAMPLES)*(max-min);
      pts.push({pct:pct,roi:payoffFn(pct)});
    }
    return pts;
  },[payoffFn,min,max]);

  var rois=points.map(function(p){return p.roi});
  var maxV=Math.max.apply(null,rois),minV=Math.min.apply(null,rois);
  if(maxV===minV){maxV+=1;minV-=1}
  var padV=(maxV-minV)*0.1;maxV+=padV;minV-=padV;
  var span=(maxV-minV)||1;

  var xAt=function(pct){return padL+((pct-min)/(max-min))*plotW};
  var yAt=function(roi){return padT+plotH-((roi-minV)/span)*plotH};
  var yZero=yAt(0);

  var linePath=points.map(function(p,i){return (i===0?"M ":"L ")+xAt(p.pct)+","+yAt(p.roi)}).join(" ");
  var areaPath="M "+xAt(min)+","+yZero+" L "+points.map(function(p){return xAt(p.pct)+","+yAt(p.roi)}).join(" L ")+" L "+xAt(max)+","+yZero+" Z";

  var rangeSpan=max-min,step=10;
  if(rangeSpan>300)step=50;else if(rangeSpan>150)step=25;else if(rangeSpan>80)step=20;else if(rangeSpan>40)step=10;else if(rangeSpan>15)step=5;else step=2;

  var gridXs=[];
  var startG=Math.ceil(min/step)*step;
  for(var g=startG;g<=max;g+=step)gridXs.push(g);

  var handleMove=function(evt){
    var svg=svgRef.current,box=chartBoxRef.current;
    if(!svg||!box)return;
    var rect=svg.getBoundingClientRect(),boxRect=box.getBoundingClientRect();
    var clientX=evt.touches?evt.touches[0].clientX:evt.clientX;
    var clientY=evt.touches?evt.touches[0].clientY:evt.clientY;
    var relX=((clientX-rect.left)/rect.width)*W;
    var pct=min+((relX-padL)/plotW)*(max-min);
    if(pct<min)pct=min;if(pct>max)pct=max;
    setHoverPct(pct);
    setMouseLocal({x:clientX-boxRect.left,y:clientY-boxRect.top,w:boxRect.width,h:boxRect.height});
  };
  var handleLeave=function(){setHoverPct(null);setMouseLocal(null)};

  var hoverRoi=hoverPct!=null?payoffFn(hoverPct):null;
  var hoverX=hoverPct!=null?xAt(hoverPct):null;
  var hoverY=hoverRoi!=null?yAt(hoverRoi):null;

  var TT_W=168,TT_H=58,ttStyle=null;
  if(mouseLocal){
    var ttLeft=mouseLocal.x+16,ttTop=mouseLocal.y-TT_H/2;
    if(ttLeft+TT_W>mouseLocal.w)ttLeft=mouseLocal.x-TT_W-16;
    if(ttLeft<0)ttLeft=4;
    if(ttTop<0)ttTop=4;
    if(ttTop+TT_H>mouseLocal.h)ttTop=mouseLocal.h-TT_H-4;
    ttStyle={left:ttLeft+"px",top:ttTop+"px"};
  }

  var showCurrent=(0>=min&&0<=max);
  var curY=showCurrent?yAt(payoffFn(0)):null;
  var curX=showCurrent?xAt(0):null;

  var title=labelForRow(kind,row);
  var basisTitle=row.basis_name||"";
  var presets=[10,20,30,50,100];

  var headTitle=(
    <span>
      {title}
      <span className="tb" style={{marginRight:6}}>{basisTitle}</span>
    </span>
  );

  var isFixedRoi=(kind==="cv"||kind==="box");

  return (
    <Modal title={headTitle} onClose={onClose} width={900}>
      {isFixedRoi?(
        <div className="ibar">
          <span className="rlbl">این استراتژی بازده ثابت و بدون وابستگی به قیمت سهم پایه دارد؛ نمودار به‌صورت خط افقی نمایش داده می‌شود.</span>
        </div>
      ):(
        <div className="ibar">
          <span className="rlbl">محدوده نمودار:</span>
          {presets.map(function(p){
            var on=(rangeMin===-p&&rangeMax===p);
            return (
              <button key={p} className={"preset-btn"+(on?" on":"")} onClick={function(){setRangeMin(-p);setRangeMax(p)}}>
                ±{p}%
              </button>
            );
          })}
          <span style={{display:"flex",alignItems:"center",gap:4,marginRight:10}}>
            از
            <input type="number" className="range-input" value={rangeMin} onChange={function(e){var v=parseFloat(e.target.value);setRangeMin(isNaN(v)?0:v)}} />
            تا
            <input type="number" className="range-input" value={rangeMax} onChange={function(e){var v=parseFloat(e.target.value);setRangeMax(isNaN(v)?0:v)}} />
            درصد
          </span>
        </div>
      )}

      <div className="payoff-body">
        <div className="payoff-info-grid">
          {row.dte!=null?<div className="pinfo"><span>روز تا سررسید</span><b>{n(row.dte)} روز</b></div>:null}
          {row.spot!=null?<div className="pinfo"><span>{L.spot}</span><b>{n(row.spot)}</b></div>:null}
          {row.break_even!=null?<div className="pinfo"><span>{L.be}</span><b>{n(row.break_even)}</b></div>:null}
          {row.max_profit!=null?<div className="pinfo"><span>{L.maxProfit}</span><b className="gain">{n(row.max_profit)}</b></div>:null}
          {row.max_loss!=null?<div className="pinfo"><span>{L.maxLoss}</span><b className="loss">{n(row.max_loss)}</b></div>:null}
        </div>

        <div className="payoff-chart-box" ref={chartBoxRef}>
          <svg ref={svgRef} viewBox={"0 0 "+W+" "+H} preserveAspectRatio="none" width="100%" height={H}
            style={{display:"block",touchAction:"none",cursor:"crosshair"}}
            onMouseMove={handleMove} onMouseLeave={handleLeave} onTouchMove={handleMove} onTouchEnd={handleLeave}>
            {gridXs.map(function(gv,i){return <line key={i} x1={xAt(gv)} x2={xAt(gv)} y1={padT} y2={H-padB} stroke="var(--bor)" strokeWidth="1" />})}
            <line x1={padL} x2={W-padR} y1={yZero} y2={yZero} stroke="var(--mut)" strokeWidth="1.5" />
            <path d={areaPath} fill={rois[rois.length-1]>=0?"var(--gain)":"var(--loss)"} opacity="0.08" />
            <path d={linePath} fill="none" stroke="var(--acc)" strokeWidth="2.4" />
            {gridXs.map(function(gv,i){return <text key={"t"+i} x={xAt(gv)} y={H-padB+18} fontSize="12" textAnchor="middle" fill="var(--mut)">{(gv>0?"+":"")+n(gv,0)+"%"}</text>})}
            <text x={6} y={padT+12} fontSize="11" fill="var(--mut)">{n(Math.round(maxV),0)}٪</text>
            <text x={6} y={H-padB-4} fontSize="11" fill="var(--mut)">{n(Math.round(minV),0)}٪</text>
            {showCurrent?(
              <g>
                <line x1={curX} x2={curX} y1={padT} y2={H-padB} stroke="var(--mut)" strokeWidth="1" strokeDasharray="3,3" opacity="0.6" />
                <circle cx={curX} cy={curY} r="6.5" fill="var(--acc)" stroke="var(--sur)" strokeWidth="2.4" />
                <text x={curX+9} y={curY-9} className="cur-label">قیمت فعلی</text>
              </g>
            ):null}
            {hoverPct!=null?(
              <g>
                <line x1={hoverX} x2={hoverX} y1={padT} y2={H-padB} stroke="var(--acc)" strokeWidth="1" strokeDasharray="4,3" />
                <circle cx={hoverX} cy={hoverY} r="5.5" fill={hoverRoi>=0?"var(--gain)":"var(--loss)"} stroke="var(--sur)" strokeWidth="2" />
              </g>
            ):null}
          </svg>
          {hoverPct!=null&&mouseLocal?(
            <div className="chart-tooltip" style={ttStyle}>
              <div className="tt-row"><span className="tt-lbl">تغییر سهم:</span><span className="tt-pct">{(hoverPct>0?"+":"")+n(Math.round(hoverPct*100)/100,2)+"%"}</span></div>
              <div className="tt-row"><span className="tt-lbl">بازده:</span><span className={"tt-roi "+(hoverRoi>=0?"gain":"loss")}>{(hoverRoi>=0?"+":"")+n(Math.round(hoverRoi*100)/100,2)+"%"}</span></div>
            </div>
          ):null}
        </div>

        <div className="payoff-readout">
          {hoverPct!=null?(
            <React.Fragment>
              <span className="ro-lbl">تغییر قیمت سهم پایه:</span>
              <span className="ro-val">{(hoverPct>0?"+":"")+n(Math.round(hoverPct*100)/100,2)+"%"}</span>
              <span className="ro-lbl">بازده در سررسید واقعی{row.dte!=null?(" ("+n(row.dte)+" روز)"):""}:</span>
              <span className={"ro-val "+(hoverRoi>=0?"gain":"loss")}>{(hoverRoi>=0?"+":"")+n(Math.round(hoverRoi*100)/100,2)+"%"}</span>
            </React.Fragment>
          ):(
            <span className="ro-hint">برای بستن این پنجره از دکمه‌ی ضربدر، کلید Esc یا کلیک بیرون از پنجره استفاده کنید.</span>
          )}
        </div>
      </div>
    </Modal>
  );
}

/* اصلاح رندرر ستون spot/basis_name در دیده‌بان: چون بک‌اند override را حتی
   روی دیده‌بان هم اعمال می‌کند (cache.watch از overrides عبور می‌کند)،
   باید نشانگر ✎ و برچسب «دستی» اینجا هم دیده شود. */
(function(){
  var spotCol=WATCH_COLS.find(function(c){return c.k==="spot"});
  if(spotCol)spotCol.r=SpotR;
  var basisCol=WATCH_COLS.find(function(c){return c.k==="basis_name"});
  if(basisCol)basisCol.r=BasisNameR;
})();

var ISSINGLE_SCENARIO_KINDS={cv:true,box:true};
var SINGLE_SCEN_LABEL_ADJ="بازده تعدیل‌شده (۳۰ روزه)";
var SINGLE_SCEN_LABEL_RAW="بازده واقعی تا سررسید";

function buildStrategyAoa(rows,cols,steps,trailingCols,isSingle){
  var headers=cols.map(function(c){return typeof c.l==="function"?c.l(L):c.k});
  if(isSingle){
    headers.push(SINGLE_SCEN_LABEL_ADJ);
    headers.push(SINGLE_SCEN_LABEL_RAW);
  }else{
    steps.forEach(function(v){headers.push("تعدیل "+(v>0?"+":"")+n(v,1)+"%")});
    steps.forEach(function(v){headers.push("واقعی "+(v>0?"+":"")+n(v,1)+"%")});
  }
  (trailingCols||[]).forEach(function(c){headers.push(typeof c.l==="function"?c.l(L):c.k)});
  var lines=rows.map(function(row){
    var vals=cols.map(function(c){return row[c.k]==null?"":row[c.k]});
    (row.scenariosAdjusted||[]).forEach(function(v){vals.push(v==null?"":Math.round(v*100)/100)});
    (row.scenariosRaw||[]).forEach(function(v){vals.push(v==null?"":Math.round(v*100)/100)});
    (trailingCols||[]).forEach(function(c){vals.push(row[c.k]==null?"":row[c.k])});
    return vals;
  });
  return [headers].concat(lines);
}
function buildWatchAoa(rows,cols){
  var headers=cols.map(function(c){return c.l(L)});
  var lines=rows.map(function(row){return cols.map(function(c){return row[c.k]==null?"":row[c.k]})});
  return [headers].concat(lines);
}
function buildBestAoa(rows,steps){
  var typeLbl=BEST_STRATEGY_LABELS;
  var headers=["استراتژی","موقعیت","سهم پایه","سررسید","روز"];
  steps.forEach(function(v){headers.push("تعدیل "+(v>0?"+":"")+n(v,1)+"%")});
  steps.forEach(function(v){headers.push("واقعی "+(v>0?"+":"")+n(v,1)+"%")});
  headers.push("شوک لازم (٪)","حداکثر شوک صعودی (٪)","حداکثر شوک نزولی (٪)","حداقل شوک واقعی (٪)","آستانهٔ سود لازم (٪)");
  var lines=rows.map(function(r){
    var vals=[typeLbl[r.strategy_type]||r.strategy_type,r.primary_name,r.basis_name,r.expiry,r.dte];
    (r.scenariosAdjusted||[]).forEach(function(v){vals.push(v==null?"":Math.round(v*100)/100)});
    (r.scenariosRaw||[]).forEach(function(v){vals.push(v==null?"":Math.round(v*100)/100)});
    vals.push(r.required_shock==null?"":r.required_shock);
    vals.push(r.actual_shock_up==null?"":(r.actual_shock_up>=HUNT_SHOCK_INF?"نامحدود":r.actual_shock_up));
    vals.push(r.actual_shock_down==null?"":(r.actual_shock_down>=HUNT_SHOCK_INF?"نامحدود":r.actual_shock_down));
    vals.push(r.min_actual_shock>=HUNT_SHOCK_INF?"نامحدود":r.min_actual_shock);
    vals.push(r.required_profit==null?"":r.required_profit);
    return vals;
  });
  return [headers].concat(lines);
}

  callspread:L.callSpread,callspreadbear:L.callSpreadBear,

};
var BEST_CAT1={cc:1,mp:1,co:1,cv:1};

/* =========================================================
   هستهٔ مشترک جدول استراتژی (بدون تفکیک قابل‌خرید/غیرقابل‌خرید)
   ========================================================= */
function StrategyTable(props){
  var kind=props.kind,data=props.data||EMPTY_ARR,allCols=props.allCols,steps=props.steps||EMPTY_ARR,
    dteFilterMin=props.dteFilterMin,dteFilterMax=props.dteFilterMax,
    store=props.store,storeKey=props.storeKey,globalSearch=props.globalSearch,
    trailingCols=props.trailingCols||EMPTY_ARR,note=props.note,exportTitle=props.exportTitle,
    onOpenChart=props.onOpenChart;

  var isSingle=!!ISSINGLE_SCENARIO_KINDS[kind];
  var scenAdjArr=isSingle?[SINGLE_SCEN_LABEL_ADJ]:steps;
  var scenRawArr=isSingle?[SINGLE_SCEN_LABEL_RAW]:steps;

  var saved=(store&&storeKey&&store[storeKey])||{};
  var sortRes=useSort(data,saved.sortKey||"roi_zero",saved.sortDir||"desc");
  var sorted=sortRes.sorted,s=sortRes.s,dir=sortRes.dir,onS=sortRes.onS;
  var filtRes=useFilters(saved.filters||{});
  var f=filtRes.f,setF=filtRes.set,clear=filtRes.clear,has=filtRes.has,applyRow=filtRes.applyRow;

  var dteMinDeb=useDebounced(dteFilterMin,180);
  var dteMaxDeb=useDebounced(dteFilterMax,180);
  var searchDeb=useDebounced(globalSearch,180);

  useEffect(function(){
    if(store&&storeKey)store[storeKey]={filters:f,sortKey:s,sortDir:dir};
  },[f,s,dir]);

  var final=useMemo(function(){
    var rows=sorted.slice();
    rows=rows.filter(function(r){
      var dte=r.dte||0;
      var minOk=dteMinDeb===""||dteMinDeb==null||dte>=parseFloat(dteMinDeb);
      var maxOk=dteMaxDeb===""||dteMaxDeb==null||dte<=parseFloat(dteMaxDeb);
      return minOk&&maxOk;
    });
    rows=rows.filter(function(r){return applyRow(r,allCols)});
    rows=rows.filter(function(r){return matchesGlobalSearch(r,searchDeb)});
    return rows;
  },[sorted,dteMinDeb,dteMaxDeb,allCols,applyRow,searchDeb]);

  var isMobile=useMemo(function(){return isMobileViewport()},[]);
  var cols=useMemo(function(){return isMobile?limitStickyCols(allCols,2):allCols},[allCols,isMobile]);
  var colW=useColWidths(kind+"_"+storeKey+"_v1",cols);

  var stickyOffset=useMemo(function(){
    var offsets={},acc=0;
    cols.forEach(function(c){if(c.sticky){offsets[c.k]=acc;acc+=colW.getWidth(c.k,c.w)}});
    return offsets;
  },[cols,colW.widths]);

  var twRef=useRef(null);
  var totalColsCount=cols.length+scenAdjArr.length+scenRawArr.length+trailingCols.length;
  var vw=useVirtualWindow(twRef,final.length,ROW_H_STRAT,HEADER_H_STRAT,VIRT_OVERSCAN);
  var visibleRows=final.length>VIRTUALIZE_THRESHOLD?final.slice(vw.start,vw.end):final;
  var topPad=final.length>VIRTUALIZE_THRESHOLD?vw.start*ROW_H_STRAT:0;
  var bottomPad=final.length>VIRTUALIZE_THRESHOLD?Math.max(0,(final.length-vw.end)*ROW_H_STRAT):0;

  function RowErrorFallback(){
    return <tr><td colSpan={totalColsCount} style={{textAlign:"center",color:"var(--loss)",fontSize:11,padding:"6px 8px"}}>خطا در نمایش این ردیف</td></tr>;
  }

  return (
    <div className="watch-view">
      {note?<div className="margin-note-banner">{note}</div>:null}
      <div className="ibar">
        <span className="count-badge">{final.length}</span>
        {props.countLabel?<span className="count-label">{props.countLabel}</span>:null}
        {has?<button className="cbtn" onClick={clear}>{L.clearFilters}</button>:null}
      </div>
      <div className="tw-wrap" style={{flex:1,minHeight:0,display:"flex",flexDirection:"column"}}>
        <div className="tw" style={{flex:1}} ref={twRef}>
          <table className="tbl-strat">
            <colgroup>
              {cols.map(function(c){return <col key={c.k} style={{width:colW.getWidth(c.k,c.w)}} />})}
              {scenAdjArr.map(function(_,i){return <col key={"csc"+i} style={{width:isSingle?120:54}} />})}
              {scenRawArr.map(function(_,i){return <col key={"craw"+i} style={{width:isSingle?120:54}} />})}
              {trailingCols.map(function(_,i){return <col key={"ct"+i} style={{width:80}} />})}
            </colgroup>
            <thead>
              <tr className="grp">
                {cols.map(function(c){
                  return <Th key={c.k} col={c.k} lbl={c.l(L)} s={s} dir={dir} onS={onS} sticky={!!c.sticky}
                    stickyRight={stickyOffset[c.k]}
                    tip={COL_TOOLTIPS[c.k]} resizable={true} onResizeStart={colW.startResize(c.k,8)} />;
                })}
                {scenAdjArr.map(function(v,i){
                  var key="sc"+i,active=s===key;
                  var label=isSingle?v:((v>0?"+":"")+n(v,1)+"٪");
                  return (
                    <th key={key} className="svh" onClick={function(){onS(key)}} role="columnheader"
                      aria-sort={active?(dir==="asc"?"ascending":"descending"):"none"} tabIndex={0}
                      onKeyDown={function(e){if(e.key==="Enter"||e.key===" "){e.preventDefault();onS(key)}}}>
                      {label}{active?<span className="s2">{dir==="asc"?"▲":"▼"}</span>:null}
                    </th>
                  );
                })}
                {scenRawArr.map(function(v,i){
                  var key="raw"+i,active=s===key;
                  var label=isSingle?v:((v>0?"+":"")+n(v,1)+"٪");
                  return (
                    <th key={key} className={"svh"+(i===0?" raw-divider":"")} onClick={function(){onS(key)}} role="columnheader"
                      aria-sort={active?(dir==="asc"?"ascending":"descending"):"none"} tabIndex={0}
                      onKeyDown={function(e){if(e.key==="Enter"||e.key===" "){e.preventDefault();onS(key)}}}>
                      {i===0?<HeaderTip text={L.scenarioNote}><span className="info-icon">ℹ</span></HeaderTip>:null}
                      {label}{active?<span className="s2">{dir==="asc"?"▲":"▼"}</span>:null}
                    </th>
                  );
                })}
                {trailingCols.map(function(c){
                  return <th key={c.k} className="svh" style={{minWidth:80}}>{typeof c.l==="function"?c.l(L):c.k}</th>;
                })}
              </tr>
              <tr className="fr">
                {cols.map(function(c){
                  return (
                    <td key={c.k} className={c.sticky?"sticky-col":undefined} style={c.sticky?{right:(stickyOffset[c.k]||0)+"px"}:undefined}>
                      <input type="text" inputMode={c.numeric?"decimal":"text"} placeholder={c.numeric?"≥":""}
                        value={f[c.k]||""} aria-label={"فیلتر "+(typeof c.l==="function"?c.l(L):c.k)}
                        onChange={function(e){setF(c.k,e.target.value)}} />
                    </td>
                  );
                })}
                {scenAdjArr.map(function(_,i){
                  return <td key={i}><input type="text" inputMode="decimal" placeholder="≥" value={f["sc"+i]||""} onChange={function(e){setF("sc"+i,e.target.value)}} style={{minWidth:44}} /></td>;
                })}
                {scenRawArr.map(function(_,i){
                  return <td key={"raw"+i} className={i===0?"raw-divider":undefined}><input type="text" inputMode="decimal" placeholder="≥" value={f["raw"+i]||""} onChange={function(e){setF("raw"+i,e.target.value)}} style={{minWidth:44}} /></td>;
                })}
                {trailingCols.map(function(c){return <td key={c.k}></td>})}
              </tr>
            </thead>
            <tbody>
              {topPad>0?<tr><td colSpan={totalColsCount} style={{height:topPad,padding:0,border:"none"}} /></tr>:null}
              {visibleRows.map(function(row){
                var rk=rowKeyFor(kind,row);
                return (
                  <ErrorBoundary key={rk} fallback={RowErrorFallback}>
                    <StrategyRowMemo row={row} cols={cols} stickyOffset={stickyOffset} trailingCols={trailingCols}
                      onOpenChart={onOpenChart?function(){onOpenChart(kind,row)}:undefined} />
                  </ErrorBoundary>
                );
              })}
              {bottomPad>0?<tr><td colSpan={totalColsCount} style={{height:bottomPad,padding:0,border:"none"}} /></tr>:null}
            </tbody>
          </table>
        </div>
        <button className="floating-export" onClick={function(){downloadXlsx(exportTitle||kind,buildStrategyAoa(final,cols,steps,trailingCols,isSingle))}}>
          ⬇ {L.exportXlsxShort}
        </button>
      </div>
    </div>
  );
}
StrategyTable=React.memo(StrategyTable);

function StrategySection(props){

/* =========================================================
   دیده‌بان
   ========================================================= */
function Watch(props){
  var rows=props.rows,store=props.store,storeKey=props.storeKey,globalSearch=props.globalSearch,
    dteFilterMin=props.dteFilterMin,dteFilterMax=props.dteFilterMax;
  var saved=(store&&storeKey&&store[storeKey])||{};
  var sortRes=useSort(rows||EMPTY_ARR,saved.sortKey||"tvalue",saved.sortDir||"desc");
  var sorted=sortRes.sorted,s=sortRes.s,dir=sortRes.dir,onS=sortRes.onS;
  var filtRes=useFilters(saved.filters||{});
  var f=filtRes.f,setF=filtRes.set,clear=filtRes.clear,has=filtRes.has,applyRow=filtRes.applyRow;
  var searchDeb=useDebounced(globalSearch,180);
  var dteMinDeb=useDebounced(dteFilterMin,180);
  var dteMaxDeb=useDebounced(dteFilterMax,180);

  var showAllArr=useLocalStorage("watchShowAllCols",!IS_TOUCH);
  var showAll=showAllArr[0],setShowAll=showAllArr[1];
  var cols=useMemo(function(){
    if(!IS_TOUCH||showAll)return WATCH_COLS;
    return WATCH_COLS.filter(function(c){return WATCH_LOW_PRIORITY_KEYS.indexOf(c.k)===-1});
  },[showAll]);

  var colW=useColWidths("watch_v1",WATCH_COLS);
  var stickyOffset=useMemo(function(){
    var offsets={},acc=0;
    cols.forEach(function(c){if(c.sticky){offsets[c.k]=acc;acc+=colW.getWidth(c.k,c.w)}});
    return offsets;
  },[cols,colW.widths]);

  useEffect(function(){
    if(store&&storeKey)store[storeKey]={filters:f,sortKey:s,sortDir:dir};
  },[f,s,dir]);

  var final=useMemo(function(){
    var r=sorted.filter(function(row){
      var dte=row.dte||0;
      var minOk=dteMinDeb===""||dteMinDeb==null||dte>=parseFloat(dteMinDeb);
      var maxOk=dteMaxDeb===""||dteMaxDeb==null||dte<=parseFloat(dteMaxDeb);
      return minOk&&maxOk;
    });
    return r.filter(function(row){return applyRow(row,WATCH_COLS)}).filter(function(row){return matchesGlobalSearch(row,searchDeb)});
  },[sorted,applyRow,searchDeb,dteMinDeb,dteMaxDeb]);

  var twRef=useRef(null);
  var totalCols=cols.length;
  var vw=useVirtualWindow(twRef,final.length,ROW_H_WATCH,HEADER_H_WATCH,VIRT_OVERSCAN);
  var visibleRows=final.length>VIRTUALIZE_THRESHOLD?final.slice(vw.start,vw.end):final;
  var topPad=final.length>VIRTUALIZE_THRESHOLD?vw.start*ROW_H_WATCH:0;
  var bottomPad=final.length>VIRTUALIZE_THRESHOLD?Math.max(0,(final.length-vw.end)*ROW_H_WATCH):0;

  function RowErrorFallback(){
    return <tr><td colSpan={totalCols} style={{textAlign:"center",color:"var(--loss)",fontSize:11,padding:"6px 8px"}}>خطا در نمایش این ردیف</td></tr>;
  }

  if(!rows||rows.length===0)return <div className="center"><span>{L.noData}</span></div>;

  return (
    <div className="watch-view">
      <div className="ibar">
        <span className="count-badge">{final.length}</span>
        <span className="count-label">قرارداد</span>
        {has?<button className="cbtn" onClick={clear}>{L.clearFilters}</button>:null}
        {IS_TOUCH?(
          <button className="cbtn cbtn-acc" onClick={function(){setShowAll(!showAll)}}>
            {showAll?L.hideExtraColumns:L.showAllColumns}
          </button>
        ):null}
      </div>
      <div className="tw-wrap" style={{flex:1,minHeight:0,display:"flex",flexDirection:"column"}}>
        <div className="tw" style={{flex:1}} ref={twRef}>
          <table className="tbl-watch">
            <colgroup>
              {cols.map(function(c){return <col key={c.k} style={{width:colW.getWidth(c.k,c.w)}} />})}
            </colgroup>
            <thead>
              <tr>
                {cols.map(function(c){
                  return <Th key={c.k} col={c.k} lbl={c.l(L)} s={s} dir={dir} onS={onS} sticky={!!c.sticky}
                    stickyRight={stickyOffset[c.k]}
                    tip={COL_TOOLTIPS[c.k]} resizable={true} onResizeStart={colW.startResize(c.k,8)} />;
                })}
              </tr>
              <tr className="fr">
                {cols.map(function(c){
                  return (
                    <td key={c.k} className={c.sticky?"sticky-col":undefined} style={c.sticky?{right:(stickyOffset[c.k]||0)+"px"}:undefined}>
                      <input type="text" inputMode={c.numeric?"decimal":"text"} placeholder={c.numeric?"≥":""}
                        value={f[c.k]||""} aria-label={"فیلتر "+c.l(L)} onChange={function(e){setF(c.k,e.target.value)}} />
                    </td>
                  );
                })}
              </tr>
            </thead>
            <tbody>
              {topPad>0?<tr><td colSpan={totalCols} style={{height:topPad,padding:0,border:"none"}} /></tr>:null}
              {visibleRows.map(function(row){
                var rk=watchRowKey(row);
                return (
                  <ErrorBoundary key={rk} fallback={RowErrorFallback}>
                    <WatchRowMemo row={row} cols={cols} stickyOffset={stickyOffset} />
                  </ErrorBoundary>
                );
              })}
              {bottomPad>0?<tr><td colSpan={totalCols} style={{height:bottomPad,padding:0,border:"none"}} /></tr>:null}
            </tbody>
          </table>
        </div>
        <button className="floating-export" onClick={function(){downloadXlsx("دیده‌بان",buildWatchAoa(final,cols))}}>
          ⬇ {L.exportXlsxShort}
        </button>
      </div>
    </div>
  );
}
Watch=React.memo(Watch);

/* =========================================================
   ویرایشگر قیمت دلخواه سهم پایه (Overrides) — از سرور
   ========================================================= */
function BasisOverridesEditor(props){
  var overrides=props.overrides||[],onAdd=props.onAdd,onToggle=props.onToggle,
    onUpdatePrice=props.onUpdatePrice,onRemove=props.onRemove,
    basisNames=props.basisNames||[],basisSpotMap=props.basisSpotMap||{};
  var stName=useState(""),stPrice=useState("");
  var newName=stName[0],setNewName=stName[1];
  var newPrice=stPrice[0],setNewPrice=stPrice[1];

  function handleAdd(){
    var name=(newName||"").trim();
    var price=parseFloat(newPrice);
    if(!name||isNaN(price)||price<=0)return;
    onAdd(name,price);
    setNewName("");setNewPrice("");
  }

  var sortedOverrides=useMemo(function(){
    return overrides.slice().sort(function(a,b){return a.name.localeCompare(b.name,"fa")});
  },[overrides]);

  return (
    <div className="msec">
      <div className="msec-t">{L.customBasisPrice}</div>
      <div className="step-hint" style={{marginBottom:10,display:"block"}}>{L.customBasisHint}</div>
      <div className="ov-add-row">
        <input type="text" list="basisNamesDatalist" className="ov-input-name"
          placeholder={L.overridePlaceholderName} value={newName}
          onChange={function(e){setNewName(e.target.value)}}
          onKeyDown={function(e){if(e.key==="Enter")handleAdd()}} />
        <datalist id="basisNamesDatalist">
          {basisNames.map(function(bn){return <option key={bn} value={bn} />})}
        </datalist>
        <input type="text" inputMode="decimal" className="ov-input-price" placeholder={L.overridePlaceholderPrice}
          value={newPrice} onChange={function(e){setNewPrice(e.target.value)}}
          onKeyDown={function(e){if(e.key==="Enter")handleAdd()}} />
        <button className="ov-add-btn" onClick={handleAdd} disabled={!newName||!newPrice}>{L.addOverride}</button>
      </div>
      {sortedOverrides.length===0?(
        <div className="step-hint">{L.noOverrides}</div>
      ):(
        <div className="ov-list">
          {sortedOverrides.map(function(o){
            var real=basisSpotMap[o.name];
            return (
              <div key={o.name} className={"ov-item"+(o.enabled?"":" off")}>
                <label className="ov-toggle" title={o.enabled?"فعال":"غیرفعال"}>
                  <input type="checkbox" checked={!!o.enabled} onChange={function(e){onToggle(o.name,e.target.checked)}} />
                </label>
                <div className="ov-name" title={o.name}>{o.name}</div>
                <div className="ov-real" title={L.realPriceShort}>{real!=null?n(real):"—"}</div>
                <NumberField className="ov-input-price sm" value={o.price} min={0}
                  onCommit={function(v){onUpdatePrice(o.name,v)}} ariaLabel={"قیمت دستی "+o.name} />
                <button className="ov-remove" onClick={function(){onRemove(o.name)}} title="حذف">✕</button>
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}
